<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Community Dashboard{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body class="admin-body"><header class="topbar"><a href="/" class="brand">◈ Community Screens</a><nav><a href="/">Displays</a><a href="/admin">Manage</a>{% if session.get('admin') %}<form method="post" action="/logout" class="inline"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="textbtn">Log out</button></form>{% endif %}</nav></header><main class="container">{% with msgs=get_flashed_messages(with_categories=true) %}{% for category,message in msgs %}<p class="flash {{ category }}">{{message}}</p>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
